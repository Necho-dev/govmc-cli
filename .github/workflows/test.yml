name: Test
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: go vet ./...
      - run: make build
      - run: go test -race ./...
        env:
          GOVMC_TUI_SIM_TEST: '1'
          GOVMC_WEB_SIM_TEST: '1'
          GOVMC_SERVE_BINARY: ${{ github.workspace }}/bin/govmc
      - run: python -m unittest discover -s tests/packaging -v
      - name: Browser regression
        run: |
          npm install --global @playwright/cli
          npx playwright install --with-deps chrome
          make web-smoke PWCLI=playwright-cli

  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test ./internal/privatefile ./internal/target ./internal/journal -v -run "TestDatabaseURLDoesNotUsePathAsHost|TestProtectedFile|TestSharedFileRejected|TestEncryptedProfilesSurviveEnvironmentAndEndpointChanges|TestMissingOrInsecureKeyDoesNotRegenerate"
      - run: go build -o bin/govmc.exe ./cmd/govmc
      - name: Verify embedded Skill installation and documented commands
        run: go test ./internal/command ./internal/mcp -run "TestEmbeddedSkill|TestSkill" -count=1 -v
      - shell: bash
        run: |
          config_path="$RUNNER_TEMP/profile/config.yaml"
          printf '%s\n' 'fixture-only' | ./bin/govmc.exe --config "$config_path" profiles add ci --url https://127.0.0.1 --username ci --password-stdin
          ./bin/govmc.exe --config "$config_path" profiles list --json
          printf '%s\n' '{"jsonrpc":"2.0","id":1,"method":"initialize"}' | ./bin/govmc.exe --config "$config_path" --profile ci mcp serve | grep protocolVersion
      - name: Verify installed Windows wheel and UTF-8 Skill output
        run: python -m unittest discover -s tests/packaging -v
        env:
          GOVMC_PACKAGED_BINARY: ${{ github.workspace }}/bin/govmc.exe
