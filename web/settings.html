<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title data-page-title="设置">设置 - GoVMC WebUI</title><link rel="stylesheet" href="/theme.css"><link rel="stylesheet" href="/app.css"><link rel="stylesheet" href="/settings.css"><script src="/cache.js" defer></script><script src="/i18n.js" defer></script><script src="/select.js" defer></script><script src="/settings.js" defer></script><link rel="stylesheet" href="/tasks.css"><script src="/tasks.js" defer></script></head><body>
  <header class="topbar">
    <a class="brand" href="/#overview" aria-label="govmc"><pre aria-hidden="true">█▀▀ █▀█ █ █ █▄ ▄█ █▀▀

    <button id="menu" class="top-icon navigation-toggle" type="button" aria-expanded="false" aria-controls="nav" aria-label="菜单" title="菜单" data-i18n-aria-label="菜单" data-i18n-title="菜单"><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M5 6h14M5 12h14M5 18h14"/></svg></button>
    <nav id="nav" aria-label="工作区" data-i18n-aria-label="工作区">
      <a href="/#overview" data-page="overview"><svg viewBox="0 0 24 24" aria-hidden="true" fill="currentColor"><path d="M3 3h8v8H3zm10 0h8v5h-8zm0 7h8v11h-8zM3 13h8v8H3z"/></svg><span data-i18n="主机总览">主机总览</span></a>
      <a href="/#console" data-page="console"><svg viewBox="0 0 24 24" aria-hidden="true" fill="currentColor"><path d="M4 3h16a2 2 0 0 1 2 2v9h-2V5H4v11h7v2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2Zm5 17h3v2H7v-2h2Z"/><path d="M13 9v12l3.2-3 2.2 4 1.8-1-2.2-4 4.4-.5L13 9Z"/></svg><span data-i18n="控制台">控制台</span></a>
      <a href="/datastores.html" class="datastores-link"><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8"><ellipse cx="12" cy="5" rx="8" ry="3"/><path d="M4 5v14c0 4 16 4 16 0V5M4 12c0 4 16 4 16 0"/></svg><span data-i18n="tab.datastores">数据存储</span></a>
    </nav>
    <div class="top-actions">
      <div class="update-status" hidden>
        <span data-i18n="更新时间">更新时间</span>
        <time id="updated"></time>
      </div>
      <div class="top-tools">
        <details id="environment" class="dropdown environment-picker" hidden>
          <summary class="top-icon environment-trigger" aria-label="切换环境" data-i18n-aria-label="切换环境"><span class="environment-initials"></span><i class="environment-dot" aria-hidden="true"></i></summary>
          <div class="dropdown-options"></div>
        </details>
        <details id="language" class="dropdown">
          <summary class="top-icon" aria-label="语言" title="语言" data-i18n-aria-label="语言" data-i18n-title="语言"><svg viewBox="0 0 24 24" aria-hidden="true" fill="currentColor"><path d="M12.9 15.1 10.4 12.6A16.4 16.4 0 0 0 14 6h2V4h-6V2H8v2H2v2h10a14.6 14.6 0 0 1-3 5 14.6 14.6 0 0 1-2.2-3H4.6a16.6 16.6 0 0 0 3 4.5l-5 5L4 19l5-5 3.1 3.1.8-2Zm5.6-6.1h-2L12 21h2l1.1-3h4.8l1.1 3h2L18.5 9Zm-2.7 7 1.7-4.5 1.7 4.5h-3.4Z"/></svg></summary>
          <div class="dropdown-options">
            <button type="button" data-language="zh" aria-pressed="false" lang="zh-CN">简体中文</button>
            <button type="button" data-language="en" aria-pressed="false" lang="en">English</button>
          </div>
        </details>
        <a class="top-icon settings-link" aria-current="page" href="/settings.html" aria-label="设置" title="设置" data-i18n-aria-label="设置" data-i18n-title="设置"><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8"><path d="m9 3-.5 2-2 1-2-.6-2 3.4 1.5 1.5v3L2.5 15l2 3.4 2-.6 2 1L9 21h4l.5-2.2 2-1 2 .6 2-3.4-1.5-1.7v-3l1.5-1.5-2-3.4-2 .6-2-1L13 3Z"/><circle cx="11" cy="12" r="3"/></svg></a>
        <div id="theme" class="theme-switch" role="group" aria-label="外观" data-i18n-aria-label="外观">
          <button type="button" class="top-icon" aria-label="浅色" title="浅色" data-i18n-aria-label="浅色" data-i18n-title="浅色" data-theme-option="light" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true" fill="currentColor"><circle cx="12" cy="12" r="5"/><path d="M11 1h2v4h-2zm0 18h2v4h-2zM1 11h4v2H1zm18 0h4v2h-4zM3.5 5l1.4-1.4 2.8 2.8-1.4 1.4zm12.8 12.8 1.4-1.4 2.8 2.8-1.4 1.4zM3.5 19l2.8-2.8 1.4 1.4-2.8 2.8zM16.3 6.3l2.8-2.8 1.4 1.4-2.8 2.8z"/></svg></button>
          <button type="button" class="top-icon" aria-label="深色" title="深色" data-i18n-aria-label="深色" data-i18n-title="深色" data-theme-option="dark" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true" fill="currentColor"><path d="M20.7 14.2A8.6 8.6 0 0 1 9.8 3.3a9 9 0 1 0 10.9 10.9Z"/></svg></button>
          <button type="button" class="top-icon" aria-label="跟随系统" title="跟随系统" data-i18n-aria-label="跟随系统" data-i18n-title="跟随系统" data-theme-option="system" aria-pressed="true"><svg viewBox="0 0 24 24" aria-hidden="true" fill="currentColor"><path d="M4 3h16a2 2 0 0 1 2 2v11a2 2 0 0 1-2 2h-7v2h4v2H7v-2h4v-2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2Z"/></svg></button>
        </div>
        <button type="button" class="top-icon" aria-label="刷新" title="刷新" data-i18n-aria-label="刷新" data-i18n-title="刷新" id="refresh"><svg viewBox="0 0 24 24" aria-hidden="true" fill="currentColor"><path d="M17.7 6.3A8 8 0 1 0 20 14h-2.1A6 6 0 1 1 16.3 7.7L13 11h8V3l-3.3 3.3Z"/></svg></button>
      </div>
    </div>
  </header>
<main class="settings-shell">
  <div class="settings-heading"><div><h1 data-i18n="设置">设置</h1></div></div>
  <div id="record-tabs" role="tablist" class="settings-tabs" aria-label="设置" data-i18n-aria-label="设置"><button type="button" role="tab" id="tab-appearance" aria-controls="appearance-panel" data-record-kind="appearance" data-i18n="外观与语言">外观与语言</button><button type="button" role="tab" id="tab-logs" aria-controls="record-panel" data-record-kind="logs" data-i18n="运行日志">运行日志</button><button type="button" role="tab" id="tab-audits" aria-controls="record-panel" data-record-kind="audits" data-i18n="操作审计">操作审计</button></div>
  <section id="appearance-panel" role="tabpanel" aria-labelledby="tab-appearance" class="appearance-panel">
    <div class="preference-heading"><div><h2 data-i18n="主题">主题</h2><p class="muted" data-i18n="选择主题。跟随系统会使用操作系统的外观偏好。">选择主题。跟随系统会使用操作系统的外观偏好。</p></div><button id="reset-appearance" type="button" class="reset-preferences" data-i18n="恢复默认">恢复默认</button></div>
    <div class="surface theme-previews" role="group" aria-label="主题" data-i18n-aria-label="主题">
      <button type="button" class="theme-preview" data-preference-theme="system" aria-pressed="false"><span class="theme-mini theme-mini-system" aria-hidden="true"><i></i><b><em></em><em></em><em></em></b></span><span data-i18n="跟随系统">跟随系统</span><span class="theme-check" aria-hidden="true">✓</span></button>
      <button type="button" class="theme-preview" data-preference-theme="light" aria-pressed="false"><span class="theme-mini theme-mini-light" aria-hidden="true"><i></i><b><em></em><em></em><em></em></b></span><span data-i18n="浅色">浅色</span><span class="theme-check" aria-hidden="true">✓</span></button>
      <button type="button" class="theme-preview" data-preference-theme="dark" aria-pressed="false"><span class="theme-mini theme-mini-dark" aria-hidden="true"><i></i><b><em></em><em></em><em></em></b></span><span data-i18n="深色">深色</span><span class="theme-check" aria-hidden="true">✓</span></button>
      <button type="button" class="theme-preview" data-preference-theme="magic-blue" aria-pressed="false"><span class="theme-mini theme-mini-magic-blue" aria-hidden="true"><i></i><b><em></em><em></em><em></em></b></span><span data-i18n="theme.magic_blue">魔法蓝</span><span class="theme-check" aria-hidden="true">✓</span></button>
      <button type="button" class="theme-preview" data-preference-theme="classic-dark" aria-pressed="false"><span class="theme-mini theme-mini-classic-dark" aria-hidden="true"><i></i><b><em></em><em></em><em></em></b></span><span data-i18n="theme.classic_dark">经典深色</span><span class="theme-check" aria-hidden="true">✓</span></button>
    </div>
    <div class="preference-heading general-heading"><div><h2 data-i18n="常规">常规</h2><p class="muted" data-i18n="设置当前浏览器的显示偏好。">设置当前浏览器的显示偏好。</p></div></div>
    <div class="surface language-preference"><div><h3 data-i18n="语言">语言</h3><p class="muted" data-i18n="选择当前浏览器使用的应用语言。">选择当前浏览器使用的应用语言。</p></div><label><span class="sr-only" data-i18n="应用语言">应用语言</span><select id="preference-language"><option value="zh">简体中文</option><option value="en">English</option></select></label></div>
  </section>
  <p id="notice" class="notice" role="alert" hidden></p>
  <section id="record-panel" role="tabpanel" hidden class="surface"><div class="section-heading"><h2 id="records-title" data-i18n="运行日志">运行日志</h2></div>
  <form id="query-form" class="record-filters">
    <label><span data-i18n="搜索">搜索</span><input id="search" type="search" placeholder="搜索事件、操作或请求 ID" data-i18n-placeholder="搜索事件、操作或请求 ID"></label>
    <label><span data-i18n="来源">来源</span><select id="source"><option value="" data-i18n="全部来源">全部来源</option><option>cli</option><option>tui</option><option>serve</option><option>mcp</option></select></label>
    <label><span data-i18n="环境">环境</span><input id="profile" type="text" placeholder="全部环境" data-i18n-placeholder="全部环境"></label>
    <label><span data-i18n="级别">级别</span><select id="level"><option value="" data-i18n="全部级别">全部级别</option><option value="INFO" data-i18n="信息">信息</option><option value="WARNING" data-i18n="警告">警告</option><option value="ERROR" data-i18n="错误">错误</option></select></label>
    <label id="outcome-label" hidden><span data-i18n="结果">结果</span><select id="outcome"><option value="" data-i18n="全部结果">全部结果</option><option value="success" data-i18n="成功">成功</option><option value="failed" data-i18n="失败">失败</option><option value="unknown" data-i18n="结果未知">结果未知</option><option value="pending" data-i18n="执行中">执行中</option><option value="denied" data-i18n="已拒绝">已拒绝</option></select></label>
    <div class="record-range"><label><span data-i18n="开始时间">开始时间</span><input id="since" type="datetime-local"></label><label><span data-i18n="结束时间">结束时间</span><input id="until" type="datetime-local"></label>
    <button type="submit" class="primary" data-i18n="查询">查询</button></div>
  </form>
  <div id="records" class="table-wrap" aria-live="polite"></div>
  <div class="inventory-pages"><span class="muted" data-i18n="仅记录脱敏事件元数据，不包含密码或请求正文">仅记录脱敏事件元数据，不包含密码或请求正文</span><div class="inventory-page-controls"><button id="previous" type="button" data-i18n="上一页">上一页</button><span id="page-number"></span><button id="next" type="button" data-i18n="下一页">下一页</button></div></div>
  </section>
</main>
<dialog id="record-dialog"><header><h2 data-i18n="记录详情">记录详情</h2></header><div id="record-content"></div><footer><button type="button" data-close-dialog data-i18n="关闭">关闭</button></footer></dialog>
<dialog id="token-dialog"><form id="token-form"><h2 data-i18n="输入 API 令牌">输入 API 令牌</h2><label><span data-i18n="令牌">令牌</span><input type="password" id="api-token" autocomplete="off" required></label><footer><button type="button" data-close-dialog data-i18n="取消">取消</button><button type="submit" class="primary" data-i18n="确认">确认</button></footer></form></dialog>
  <dialog id="environment-confirm" class="disconnect-dialog" aria-labelledby="environment-title" aria-describedby="environment-target environment-detail">
    <form method="dialog">
      <h2 id="environment-title" data-i18n="切换环境">切换环境</h2>
      <dl id="environment-target" class="environment-switch-targets">
        <div><dt data-i18n="当前环境">当前环境</dt><dd><strong id="environment-from-name"></strong><small id="environment-from-address"></small></dd></div>
        <div><dt data-i18n="目标环境">目标环境</dt><dd><strong id="environment-to-name"></strong><small id="environment-to-address"></small></dd></div>
      </dl>
      <div id="environment-detail" class="environment-switch-notes">
        <p data-i18n="返回工作台后将使用所选环境。">返回工作台后将使用所选环境。</p>
        <p data-i18n="环境切换不会改变虚拟机的电源状态。">环境切换不会改变虚拟机的电源状态。</p>
      </div>
      <div class="disconnect-actions">
        <button type="submit" value="cancel" autofocus data-i18n="取消">取消</button>
        <button type="submit" value="switch" class="primary" data-i18n="确认切换">确认切换</button>
      </div>
    </form>
  </dialog>
</body></html>
